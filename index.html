<html lang="en"><head>

<title>Ryan Barrs, PhD</title>

<meta property="og:title" content="Ryan Barrs, PhD"><meta property="og:description" content="Bioengineer. Research, papers, writing, talks, resume and CV.">
<meta property="og:type" content="website"><meta property="og:url" content="https://barrsr.github.io/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 3h12v12H3z' fill='%232a2a28'/%3E%3Cpath d='M17 3h12v12H17z' fill='%239a978f'/%3E%3Cpath d='M3 17h12v12H3z' fill='%235a5955'/%3E%3Cpath d='M17 17h12v12H17z' fill='%23d8361e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f1ef;--ink:#2a1633;--soft:#7d6680;--accent:#d9739f}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;font:400 1.08rem/1.55 "Times New Roman",Times,"Tinos",serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.stage{position:relative;height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(22px,4vw,56px);pointer-events:none}
.stage a{pointer-events:auto}
nav{justify-self:end;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:clamp(18px,2.6vw,44px)}
nav a{position:relative;color:var(--ink);text-decoration:none;font:700 clamp(1.15rem,1.65vw,1.6rem)/1 "Times New Roman",Times,"Tinos",serif;letter-spacing:-.01em;padding:4px 0;text-shadow:0 0 18px var(--bg),0 0 6px var(--bg)}
nav a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--accent);transform:scaleX(0);transform-origin:right;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
nav a:hover::after,nav a:focus-visible::after{transform:scaleX(1);transform-origin:left}
nav a:focus-visible{outline:none}
.id{align-self:end}
h1{margin:0;font:700 clamp(4.6rem,12.5vw,12.5rem)/.86 "Times New Roman",Times,"Tinos",serif;line-height:.86;letter-spacing:-.02em;color:var(--ink);text-shadow:0 0 40px var(--bg),0 0 14px var(--bg)}
h1 .phd{font:italic 700 .3em/1 "Times New Roman",Times,"Tinos",serif;letter-spacing:0;color:var(--accent);margin-left:.18em;vertical-align:.08em}
.lede{max-width:44ch;margin:clamp(30px,4.6vh,52px) 0 0;font-size:clamp(1.02rem,1.25vw,1.2rem);color:var(--ink);text-shadow:0 0 22px var(--bg),0 0 8px var(--bg),0 0 3px var(--bg)}
.aside{margin:10px 0 0;font:italic 400 clamp(.98rem,1.1vw,1.08rem)/1.4 "Times New Roman",Times,"Tinos",serif;color:var(--soft);text-shadow:0 0 14px var(--bg),0 0 5px var(--bg)}
.foot{display:flex;justify-content:space-between;align-items:end;margin-top:clamp(18px,3vh,34px);font:400 .9rem/1.3 "Times New Roman",Times,"Tinos",serif;color:var(--soft);text-shadow:0 0 12px var(--bg)}
@media (max-width:640px){nav{justify-self:start;flex-wrap:wrap;gap:16px}.foot{flex-direction:column;align-items:start;gap:6px}}
</style></head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<main class="stage">
  <nav aria-label="Sections"><a href="#research">Research</a><a href="#papers">Papers</a><a href="#writing">Writing</a><a href="#talks">Talks</a><a href="#resume">Resume</a><a href="#now">Now</a><a href="#contact">Contact</a></nav>
  <div></div>
  <div class="id">
    <h1>Ryan Barrs<span class="phd">PhD</span></h1>
    <p class="lede">I work on testing new therapies before they reach patients, and I like explaining science so anyone can understand it.</p>
    <p class="aside">Front porch state of mind.</p>
  </div>
</main>
<script src="cells.js?v=18"></script>
<script src="panels-stain.js?v=18"></script>
<script>
const PALS={"pink": {"bg": "#f8f1ef", "ink": "#2a1633", "soft": "#7d6680", "acc": "#d9739f", "tiles": ["#f5b3cc", "#dc8cbd", "#bd9edb", "#f9cbb8"]}, "midcentury": {"bg": "#f4eee1", "ink": "#262420", "soft": "#6e6658", "acc": "#cf6a32", "tiles": ["#e3aa35", "#2f7f7a", "#cf6a32", "#8d9a5b"]}, "ocean": {"bg": "#f1f4f3", "ink": "#13263a", "soft": "#5b6b78", "acc": "#2c7d9b", "tiles": ["#a8d1d6", "#4f8fa8", "#cfe0d6", "#245a78"]}, "ink": {"bg": "#f3f2ee", "ink": "#111111", "soft": "#66625b", "acc": "#d8361e", "tiles": ["#2a2a28", "#5a5955", "#9a978f", "#cfccc4"]}, "miami": {"bg": "#fbf6f1", "ink": "#1d2b3a", "soft": "#6b7280", "acc": "#f0725f", "tiles": ["#ff9a85", "#ffc970", "#62c8c1", "#b9e4c9"]}};
const PK=(new URLSearchParams(location.search).get('p')||'ink'), PAL=PALS[PK]||PALS.ink;
const v3=h=>{const n=parseInt(h.slice(1),16);return `vec3(${((n>>16&255)/255).toFixed(3)},${((n>>8&255)/255).toFixed(3)},${((n&255)/255).toFixed(3)})`};
const R=document.documentElement.style;R.setProperty('--bg',PAL.bg);R.setProperty('--ink',PAL.ink);R.setProperty('--soft',PAL.soft);R.setProperty('--accent',PAL.acc);R.setProperty('--tint',PAL.tiles[0]);R.setProperty('--tint2',PAL.tiles[3]);
const T=PAL.tiles.map(v3);
const PRE=`vec3 pal(float t){t=fract(t);vec3 a=${T[0]},b=${T[1]},c=${T[2]},e=${T[3]};return t<.25?a:t<.5?b:t<.75?c:e;}vec3 BGC(){return ${v3(PAL.bg)};}`;

Cells({prelude:PRE,avoid:'h1,.lede,.aside,nav',canvas:document.getElementById('c'),max:170,r:[22,46],k:10,overlap:0.84,style:`
  vec3 bg=BGC()-(g-.5)*.015;
  float edge=d2-d1;
  float m=smoothstep(3.,5.,edge)*smoothstep(4.,-4.,d1-r1*.35)*smoothstep(5.,14.,r1);
  vec3 c=pal(s1);
  c*=.96+.07*smoothstep(0.,r1,-d1);
  col=mix(bg,c,m);`});
</script>
</body></html>
