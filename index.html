<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ryan Barrs, PhD</title>
<meta name="description" content="Ryan Barrs, PhD. Bioengineer and science writer in Miami. I build human tissue models to test new therapies, and I write about science for people outside the lab.">
<meta property="og:title" content="Ryan Barrs, PhD"><meta property="og:description" content="Bioengineer and science writer in Miami. Research, writing, talks and contact.">
<meta property="og:type" content="website"><meta property="og:url" content="https://barrsr.github.io/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 4'%3E%3Crect width='4' height='4' fill='%23efeee9'/%3E%3Crect x='1' width='1' height='1'/%3E%3Crect x='2' y='1' width='1' height='1'/%3E%3Crect y='2' width='3' height='1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500;62..125,900&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{--paper:#efeee9;--ink:#000;--red:#e1250f;--grid:#d6d4cd}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font:400 1.1rem/1.5 "Newsreader",Georgia,serif;-webkit-font-smoothing:antialiased;cursor:crosshair}
canvas{position:fixed;inset:0;width:100%;height:100%}
.stage{position:relative;height:100svh;display:grid;grid-template-rows:1fr auto;padding:clamp(18px,3vw,40px);pointer-events:none}
.stage>*{pointer-events:auto}
h1{align-self:center;margin:0;font:900 clamp(4rem,min(17vw,30vh),17rem)/.8 "Archivo",sans-serif;font-stretch:62%;letter-spacing:-.01em;color:transparent;pointer-events:none;user-select:none}
.bottom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end}
.box{justify-self:start;background:var(--paper);border:3px solid #000;padding:16px 18px;box-shadow:8px 8px 0 #000}
.lede{max-width:42ch;margin:0;font-size:clamp(1rem,1.3vw,1.18rem)}
.lede small{display:block;margin-top:8px;font:500 .9rem/1.3 "Archivo",sans-serif;font-stretch:90%;color:#45433d}
nav{display:flex;flex-wrap:wrap;background:var(--paper);box-shadow:8px 8px 0 #000}
nav a{font:900 clamp(1rem,1.6vw,1.35rem)/1 "Archivo",sans-serif;font-stretch:80%;color:#000;text-decoration:none;padding:16px 16px 14px;border:3px solid #000;margin-left:-3px}
nav a:first-child{margin-left:0}
nav a:hover,nav a:focus-visible{background:#000;color:var(--paper);outline:none}
.count{position:fixed;z-index:3;right:clamp(18px,3vw,40px);top:clamp(18px,3vw,40px);font:500 .95rem/1 "Archivo",sans-serif;font-stretch:90%;background:var(--paper);border:3px solid #000;padding:9px 11px 7px;font-variant-numeric:tabular-nums}
.count b{font-weight:900}
@media (max-width:760px){.bottom{grid-template-columns:1fr}}
.phd{display:inline-block;margin-left:.1em;padding:.1em .16em .04em;font-size:.2em;line-height:1;vertical-align:.25em;letter-spacing:.02em;background:#000;color:#efeee9;-webkit-text-stroke:0;box-shadow:.12em .12em 0 #e1250f}
body{user-select:none;-webkit-user-select:none}
</style></head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<p class="count" aria-hidden="true">generation <b id="gen">0</b>, <b id="pop">0</b> cells</p>
<main class="stage">
  <h1 aria-label="Ryan Barrs, PhD">Ryan<br>Barrs<span class="phd" aria-hidden="true">PhD</span></h1>
  <div class="bottom">
    <div class="box"><p class="lede">Bioengineer and science writer in Miami. I build human tissue models to test new therapies, and I write about science for people outside the lab.<small>Move to seed cells. Click to drop a colony.</small></p></div>
    <nav><a href="#research">Research</a><a href="#writing">Writing</a><a href="#talks">Talks</a><a href="#now">Now</a><a href="#contact">Contact</a></nav>
  </div>
</main>
<script>
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let S=14,cols,rows,grid,next,age,W,H,dpr,gen=0;
function setup(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.max(10,Math.round(Math.min(W,H)/62));cols=Math.ceil(W/S);rows=Math.ceil(H/S);grid=new Uint8Array(cols*rows);next=new Uint8Array(cols*rows);age=new Uint16Array(cols*rows);
  // seed a few colonies so the plate is alive on arrival
  for(let k=0;k<7;k++)colony(Math.random()*cols|0,Math.random()*rows|0,6);buildMask()}
let mask=null,tx=null;
function textSpec(){const h=document.querySelector('h1'),r=h.getBoundingClientRect(),fs=parseFloat(getComputedStyle(h).fontSize);return{r,fs}}
function buildMask(){const {r,fs}=textSpec();tx=document.createElement('canvas');tx.width=W;tx.height=H;const o=tx.getContext('2d');o.fillStyle='#000';o.font=`900 ${fs}px Archivo`;o.textBaseline='alphabetic';
  o.fillText('Ryan',r.left,r.top+fs*.74);o.fillText('Barrs',r.left,r.top+fs*1.54);mask=new Uint8Array(cols*rows);const d=o.getImageData(0,0,W,H).data;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const px=Math.min(W-1,x*S+S/2|0),py=Math.min(H-1,y*S+S/2|0);mask[y*cols+x]=d[(py*W+px)*4+3]>128?1:0}}
const idx=(x,y)=>((y+rows)%rows)*cols+((x+cols)%cols);
function colony(cx,cy,r){for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r&&Math.random()<.42)grid[idx(cx+x,cy+y)]=1}
function step(){for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dx||dy)n+=grid[idx(x+dx,y+dy)];
  const i=y*cols+x,a=grid[i];next[i]=(a&&(n===2||n===3))||(!a&&n===3)?1:0;age[i]=next[i]?(a?Math.min(age[i]+1,999):0):0}
  [grid,next]=[next,grid];gen++}
function draw(){ctx.fillStyle='#efeee9';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#dcdad3';ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<=cols;x++){ctx.moveTo(x*S+.5,0);ctx.lineTo(x*S+.5,H)}for(let y=0;y<=rows;y++){ctx.moveTo(0,y*S+.5);ctx.lineTo(W,y*S+.5)}ctx.stroke();
  if(tx)ctx.drawImage(tx,0,0,W,H);
  let pop=0;for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const i=y*cols+x;if(!grid[i])continue;pop++;
    ctx.fillStyle=mask&&mask[i]?(age[i]<1?'#e1250f':'#efeee9'):(age[i]<1?'#e1250f':'#000');ctx.fillRect(x*S+1,y*S+1,S-1,S-1)}
  document.getElementById('gen').textContent=gen;document.getElementById('pop').textContent=pop;
  if(pop<cols*rows*.012&&gen%40===0)colony(Math.random()*cols|0,Math.random()*rows|0,5)}
addEventListener('pointermove',e=>{const x=e.clientX/S|0,y=e.clientY/S|0;for(let k=0;k<3;k++)grid[idx(x+((Math.random()*3)|0)-1,y+((Math.random()*3)|0)-1)]=1},{passive:true});
addEventListener('click',e=>{if(e.target.closest('a,button,dialog'))return;colony(e.clientX/S|0,e.clientY/S|0,5)});
setup();addEventListener('resize',setup);
let last=0;function loop(t){if(!still&&t-last>90){step();last=t}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
<script src="panels.js"></script>
</body></html>
