<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ryan Barrs, PhD</title>
<meta name="description" content="Ryan Barrs, PhD. Bioengineer based in Miami. I work on testing new therapies before they reach patients, and I like explaining science so anyone can understand it.">
<meta property="og:title" content="Ryan Barrs, PhD"><meta property="og:description" content="Bioengineer based in Miami. Research, papers, writing, talks, resume and contact.">
<meta property="og:type" content="website"><meta property="og:url" content="https://barrsr.github.io/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 4'%3E%3Crect width='4' height='4' fill='%23efeee9'/%3E%3Crect x='1' width='1' height='1'/%3E%3Crect x='2' y='1' width='1' height='1'/%3E%3Crect y='2' width='3' height='1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f2f0eb;--ink:#111;--red:#d8361e;--soft:#615c55}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font:400 1.1rem/1.5 "Times New Roman",Times,"Tinos",serif;-webkit-font-smoothing:antialiased;cursor:crosshair}
canvas{position:fixed;inset:0;width:100%;height:100%}
.stage{position:relative;height:100svh;display:grid;grid-template-rows:1fr auto;padding:clamp(18px,3vw,40px);pointer-events:none}
.stage>*{pointer-events:auto}
h1{align-self:center;margin:0;font:700 clamp(4rem,min(15vw,27vh),15rem)/.84 "Times New Roman",Times,"Tinos",serif;letter-spacing:-.02em;color:transparent;pointer-events:none;user-select:none}
.bottom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end}
.box{justify-self:start}
.lede{max-width:40ch;margin:0;font-size:clamp(1.05rem,1.35vw,1.25rem);text-wrap:balance}
nav{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:clamp(16px,2.2vw,34px)}
nav a{position:relative;font:700 clamp(1.1rem,1.55vw,1.45rem)/1 "Times New Roman",Times,"Tinos",serif;color:var(--ink);text-decoration:none;padding:6px 0}
nav a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--red);transform:scaleX(0);transform-origin:right;transition:transform .45s cubic-bezier(.16,1,.3,1)}
nav a:hover::after,nav a:focus-visible::after{transform:scaleX(1);transform-origin:left}nav a:focus-visible{outline:none}
.count{position:fixed;z-index:3;right:clamp(18px,3vw,40px);top:clamp(18px,3vw,40px);margin:0;font:italic 400 1rem/1 "Times New Roman",Times,"Tinos",serif;color:var(--soft);font-variant-numeric:tabular-nums}
.count b{font-weight:700;font-style:normal;color:var(--ink)}
@media (max-width:760px){.bottom{grid-template-columns:1fr}}
.phd{display:inline-block;margin-left:.12em;font:italic 700 .26em/1 "Times New Roman",Times,"Tinos",serif;letter-spacing:0;color:var(--red);vertical-align:.1em}
body{user-select:none;-webkit-user-select:none}
</style></head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<p class="count" aria-hidden="true">generation <b id="gen">0</b>, <b id="pop">0</b> cells</p>
<main class="stage">
  <h1 aria-label="Ryan Barrs, PhD">Ryan<br>Barrs<span class="phd" aria-hidden="true">PhD</span></h1>
  <div class="bottom">
    <div class="box"><p class="lede">Bioengineer based in Miami. I work on testing new therapies before they reach patients, and I like explaining science so anyone can understand it.</p></div>
    <nav><a href="#research">Research</a><a href="#papers">Papers</a><a href="#writing">Writing</a><a href="#talks">Talks</a><a href="#resume">Resume</a><a href="#now">Now</a><a href="#contact">Contact</a></nav>
  </div>
</main>
<script>
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let S=14,cols,rows,grid,next,age,W,H,dpr,gen=0;
function setup(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.max(10,Math.round(Math.min(W,H)/62));cols=Math.ceil(W/S);rows=Math.ceil(H/S);grid=new Uint8Array(cols*rows);next=new Uint8Array(cols*rows);age=new Uint16Array(cols*rows);
  // seed a few colonies so the plate is alive on arrival
  for(let k=0;k<7;k++)colony(Math.random()*cols|0,Math.random()*rows|0,6);buildMask()}
let mask=null,tx=null;
function textSpec(){const h=document.querySelector('h1'),r=h.getBoundingClientRect(),fs=parseFloat(getComputedStyle(h).fontSize);return{r,fs}}
function buildMask(){const h=document.querySelector('h1');tx=document.createElement('canvas');tx.width=W;tx.height=H;const o=tx.getContext('2d');o.fillStyle='#000';o.textBaseline='alphabetic';
  const fs=parseFloat(getComputedStyle(h).fontSize);o.font=`700 ${fs}px "Times New Roman",Times,Tinos,serif`;
  const nodes=[...h.childNodes].filter(n=>n.nodeType===3&&n.textContent.trim());
  nodes.forEach(n=>{const rg=document.createRange();rg.selectNodeContents(n);const r=rg.getBoundingClientRect(),t=n.textContent.trim(),m=o.measureText(t);
    const pr=document.createElement('span');pr.style.cssText='display:inline-block;width:0;height:0;vertical-align:baseline';n.after(pr);const base=pr.getBoundingClientRect().bottom;pr.remove();
    o.save();o.translate(r.left,base);o.scale(r.width/m.width,1);o.fillText(t,0,0);o.restore()});
  mask=new Uint8Array(cols*rows);const d=o.getImageData(0,0,W,H).data;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const px=Math.min(W-1,x*S+S/2|0),py=Math.min(H-1,y*S+S/2|0);mask[y*cols+x]=d[(py*W+px)*4+3]>128?1:0}}
const idx=(x,y)=>((y+rows)%rows)*cols+((x+cols)%cols);
function colony(cx,cy,r){for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r&&Math.random()<.42)grid[idx(cx+x,cy+y)]=1}
function step(){for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dx||dy)n+=grid[idx(x+dx,y+dy)];
  const i=y*cols+x,a=grid[i];next[i]=(a&&(n===2||n===3))||(!a&&n===3)?1:0;age[i]=next[i]?(a?Math.min(age[i]+1,999):0):0}
  [grid,next]=[next,grid];gen++;clearZones()}
let zones=[];function measureZones(){zones=[];document.querySelectorAll('.lede,nav a,.count,h1 .phd').forEach(e=>{const rg=document.createRange();rg.selectNodeContents(e);for(const b of rg.getClientRects())if(b.width>2)zones.push(b)})}
function clearZones(){const m=S*1.2;for(const b of zones){const x0=Math.max(0,(b.left-m)/S|0),x1=Math.min(cols-1,(b.right+m)/S|0),y0=Math.max(0,(b.top-m)/S|0),y1=Math.min(rows-1,(b.bottom+m)/S|0);for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)grid[y*cols+x]=0}}
function draw(){ctx.fillStyle='#f2f0eb';ctx.fillRect(0,0,W,H);
  if(tx)ctx.drawImage(tx,0,0,W,H);
  let pop=0;for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const i=y*cols+x;if(!grid[i])continue;pop++;
    ctx.fillStyle=mask&&mask[i]?(age[i]<1?'#d8361e':'#f2f0eb'):(age[i]<1?'#d8361e':'#111');ctx.fillRect(x*S+1,y*S+1,S-1.5,S-1.5)}
  document.getElementById('gen').textContent=gen;document.getElementById('pop').textContent=pop;
  if(pop<cols*rows*.012&&gen%40===0)colony(Math.random()*cols|0,Math.random()*rows|0,5)}
addEventListener('pointermove',e=>{const x=e.clientX/S|0,y=e.clientY/S|0;for(let k=0;k<3;k++)grid[idx(x+((Math.random()*3)|0)-1,y+((Math.random()*3)|0)-1)]=1},{passive:true});
addEventListener('click',e=>{if(e.target.closest('a,button,dialog'))return;colony(e.clientX/S|0,e.clientY/S|0,5)});
setup();measureZones();addEventListener('resize',()=>{setup();measureZones()});document.fonts.ready.then(measureZones);document.fonts.load('700 100px Tinos').then(buildMask);document.fonts.ready.then(buildMask);
let last=0;function loop(t){if(!still&&t-last>90){step();last=t}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
<script src="panels.js?v=62"></script>
</body></html>
